workflows:

  # ── iOS App Store / TestFlight ─────────────────────────────────────────────
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Code signing — настраивается в Codemagic UI:
      # App Store Connect > Teams > Code signing identities
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aiapp.hypcut.hyperCut

      # Версия Flutter (можно заменить на конкретную: '3.19.6')
      flutter: stable
      xcode: latest
      cocoapods: default

      # Переменные окружения — задаются в Codemagic UI (зашифрованные):
      # API_BASE_URL      = https://api.trimvo.app/v1
      # STORAGE_BASE_URL  = https://storage.trimvo.app
      vars:
        BUNDLE_ID: com.aiapp.hypcut.hyperCut

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=STORAGE_BASE_URL=$STORAGE_BASE_URL

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration          # App Store Connect API key в Codemagic UI
        submit_to_testflight: true
        cancel_previous_submissions: true
      email:
        recipients:
          - vektor9966@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS Ad Hoc (для тестеров без TestFlight) ───────────────────────────────
  ios-adhoc:
    name: iOS Ad Hoc (Testers)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.aiapp.hypcut.hyperCut
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Build iOS IPA (Ad Hoc)
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=STORAGE_BASE_URL=$STORAGE_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - vektor9966@gmail.com
        notify:
          success: true
          failure: true
