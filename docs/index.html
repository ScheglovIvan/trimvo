<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trimvo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; color: #9e9e9e; margin-bottom: 40px; }
    .links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .links a {
      color: #8b47f5;
      text-decoration: none;
      font-size: 15px;
      border: 1px solid #8b47f5;
      padding: 10px 24px;
      border-radius: 30px;
    }
    .links a:hover { background: #8b47f5; color: #fff; }
    .contact { margin-top: 48px; font-size: 13px; color: #616161; }
    .contact a { color: #616161; }
  </style>
</head>
<body>
  <h1>Trimvo</h1>
  <p>AI-powered video generation</p>
  <div class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </div>
  <p class="contact">Support: <a href="mailto:support@trimvo.xyz">support@trimvo.xyz</a></p>
</body>
</html>
