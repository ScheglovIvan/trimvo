name: trimvo
description: "AI Video Generator - Trimvo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.0
  flutter_animate: ^4.5.0
  video_player: ^2.8.6
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  flutter_staggered_grid_view: ^0.7.0
  saver_gallery: ^3.0.6
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/templates/
    - assets/images/photo_picker/
    - assets/images/logo.png
    - assets/videos/welcome.mp4
    - assets/videos/img2img.mp4
    - assets/videos/img2video.mp4
